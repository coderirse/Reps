name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Privacy check - no INTERNET permission
        run: ./gradlew verifyNoInternetPermission --console=plain

      - name: Build debug
        run: ./gradlew assembleDebug --console=plain

      - name: Build release (unsigned on CI - keystore is not committed)
        run: ./gradlew assembleRelease --console=plain
